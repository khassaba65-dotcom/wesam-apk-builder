name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App display name'
        required: true
      package_name:
        description: 'Package (com.example.app)'
        required: true
      version:
        description: 'Version'
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Cordova and ImageMagick
        run: |
          npm install -g cordova@12
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Prepare source
        run: |
          mkdir -p src_www
          if [ -f source.zip ]; then
            unzip -q source.zip -d src_www/
          else
            echo "<h1>Hello</h1>" > src_www/index.html
          fi
          if [ $(ls src_www | wc -l) -eq 1 ] && [ -d "src_www/$(ls src_www)" ]; then
            mv src_www/*/* src_www/ 2>/dev/null || true
          fi

      - name: Create Cordova project
        run: |
          cordova create app "${{ github.event.inputs.package_name }}" "${{ github.event.inputs.app_name }}"
          rm -rf app/www/*
          cp -r src_www/* app/www/ 2>/dev/null || true

      - name: Add Android platform
        working-directory: app
        run: |
          cordova platform add android
          echo "=== platforms/android ==="
          ls -la platforms/android/ | head -20
          echo "=== gradlew check ==="
          ls -la platforms/android/gradlew || echo "GRADLEW MISSING"

      - name: First build to generate gradlew
        working-directory: app
        run: cordova build android

      - name: Verify gradlew exists
        working-directory: app/platforms/android
        run: |
          ls -la gradlew
          test -f gradlew && echo "✓ gradlew ready" || exit 1

      - name: Replace icons and splashes
        run: |
          RES="app/platforms/android/app/src/main/res"
          ICON="${{ github.workspace }}/icon.png"
          SPLASH="${{ github.workspace }}/splash.png"
          
          echo "=== Target res folder ==="
          ls -la $RES | head -30
          
          # ===== ICONS =====
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%:*}"; s="${pair#*:}"
            mkdir -p "$RES/mipmap-$d"
            if [ -f "$ICON" ]; then
              convert "$ICON" -resize ${s}x${s} -background none -gravity center -extent ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
              convert "$ICON" -resize ${s}x${s} -background none -gravity center -extent ${s}x${s} "$RES/mipmap-$d/ic_launcher_round.png"
              convert "$ICON" -resize ${s}x${s} -background none -gravity center -extent ${s}x${s} "$RES/mipmap-$d/ic_launcher_foreground.png"
            fi
          done
          
          # ===== SPLASH =====
          for pair in mdpi:320x480 hdpi:480x800 xhdpi:720x1280 xxhdpi:960x1600 xxxhdpi:1280x1920; do
            d="${pair%:*}"; s="${pair#*:}"
            mkdir -p "$RES/drawable-port-$d"
            if [ -f "$SPLASH" ]; then
              convert "$SPLASH" -resize ${s}^ -gravity center -background "#0a0e1a" -extent ${s} "$RES/drawable-port-$d/screen.png"
            fi
          done
          
          # Landscape splashes
          for pair in mdpi:480x320 hdpi:800x480 xhdpi:1280x720 xxhdpi:1600x960 xxxhdpi:1920x1280; do
            d="${pair%:*}"; s="${pair#*:}"
            mkdir -p "$RES/drawable-land-$d"
            if [ -f "$SPLASH" ]; then
              convert "$SPLASH" -resize ${s}^ -gravity center -background "#0a0e1a" -extent ${s} "$RES/drawable-land-$d/screen.png"
            fi
          done
          
          echo "=== Icons generated ==="
          ls -la $RES/mipmap-mdpi/ic_launcher.png
          echo "=== Splashes generated ==="
          ls -la $RES/drawable-port-mdpi/screen.png

      - name: Rebuild APK with Gradle
        working-directory: app/platforms/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find and copy APK
        run: |
          find app/platforms/android/app/build/outputs -name "*.apk" -exec cp {} ./built.apk \;
          ls -la built.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: built.apk
          retention-days: 1
